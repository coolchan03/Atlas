name: Build Atlas APK

# Builds an installable Android APK (arm64 phones) on every push to atlas-voice,
# and publishes it on the Releases page so it can be downloaded on the phone.
on:
  push:
    branches: [atlas-voice]
  workflow_dispatch:

jobs:
  apk:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Use the runner's Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc || true
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-
      - name: Install JS dependencies
        run: npm ci --ignore-scripts
      - name: Install llama.rn native artifacts
        run: node node_modules/llama.rn/install/download-native-artifacts.js
      - name: Apply audited native dependency patches
        run: ./node_modules/.bin/patch-package
      - name: Type check (informational, Atlas files reported as warnings)
        run: |
          ./node_modules/.bin/tsc --noEmit -p . > tsc.log 2>&1 || true
          grep -E "error TS" tsc.log | grep -iE "atlas|MyModels|officeExtract|documentService|modelManager|importHelpers|quickImport|textGenAdvanced|Popovers|ChatInput|accel|thinking|storage|loaders|types/index|App.tsx|Maps|About|Onboarding|RemoteServers|ModelDownload|Agents|theme/|constants/|sharePrompt|Upsell|learning|agent|websearch|useWideLayout|handlers.ts|llmHelpers|generationToolLoop|ChatScreen/index|AgentChip|Emergency|KnowledgeBaseScreen|SettingsScreen|HomeScreen|OfflineLibrary|offlineLibrary|survival|Survival|lowPower|Phrase|Study|study|deviceTools|Private|AssistantAccess|ProjectDetail|ModelTest|ChatContextSection|AudioInput|contextCompaction|navigation/|ReplyEta|DailyBrief|Attachments|LowPowerCard|ctxGuard|loaders|useModelsScreen|llmHelpers|tools/handlers|ChatMessageArea|services/llm|litert.ts" | head -40 | while IFS= read -r l; do echo "::warning::$l"; done
          echo "::notice title=TypeScript::total TS errors: $(grep -c 'error TS' tsc.log)"
      - name: Get natural-voice engine (sherpa-onnx)
        run: |
          mkdir -p android/app/libs
          curl --fail --silent --show-error --location --retry 3 --proto '=https' --proto-redir '=https' -o android/app/libs/sherpa-onnx.aar https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.7/sherpa-onnx-1.13.7.aar
          echo "c4ef49e309f24fcee5c106b8a279481aaecaabb078cd37b2cd6e9a62cc8a73c8  android/app/libs/sherpa-onnx.aar" | sha256sum -c -
          # phones only need 64-bit ARM: drop the other CPU types to keep the APK small
          zip -q -d android/app/libs/sherpa-onnx.aar 'jni/armeabi-v7a/*' 'jni/x86/*' 'jni/x86_64/*' || true
          ls -la android/app/libs
      - name: Build release APK
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon 2>&1 | tee ../gradle.log || {
            grep -E "^e: |error:|What went wrong|Could not|Execution failed|Unresolved|Duplicate|Manifest merger|Attribute |Suggestion|> Task .*FAILED|Caused by" ../gradle.log | grep -v "^w: " | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }
      - name: Verify release native runtime
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          unzip -l "$APK" > apk-contents.txt
          grep -q 'lib/arm64-v8a/librnllama.so' apk-contents.txt
          grep -q 'lib/arm64-v8a/librnllama_v8.so' apk-contents.txt
          grep -q 'lib/arm64-v8a/librnllama_v8_2.so' apk-contents.txt
          node -e "const p=require('./node_modules/llama.rn/package.json'); if(p.version!=='0.13.0-rc.4') { console.error('Unexpected llama.rn version:',p.version); process.exit(1) } console.log('Verified llama.rn',p.version)"
          echo "Verified Atlas release contains the ARM64 llama.rn native runtime."
      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/Atlas-${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Atlas-apk
          path: out/*.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create atlas-${{ github.run_number }} out/*.apk --latest \
            --target ${{ github.sha }} --title "Atlas build ${{ github.run_number }}" \
            --notes "Install this APK on your Android phone or tablet (download it, open it, allow installing from this source)."
