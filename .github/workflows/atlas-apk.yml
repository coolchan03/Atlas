name: Build Atlas APK

# Builds an installable Android APK (arm64 phones) on every push to atlas-voice,
# and publishes it on the Releases page so it can be downloaded on the phone.
on:
  push:
    branches: [atlas-voice]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Use the runner's Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc || true
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-
      - name: Install JS dependencies
        run: npm ci
      - name: Type check (informational, Atlas files reported as warnings)
        run: |
          npx tsc --noEmit -p . > tsc.log 2>&1 || true
          grep -E "error TS" tsc.log | grep -iE "atlas|learning|agent|websearch|useWideLayout|handlers.ts|llmHelpers|generationToolLoop|ChatScreen/index|AgentChip|Emergency|KnowledgeBaseScreen|SettingsScreen|HomeScreen|OfflineLibrary|offlineLibrary|survival|Survival|lowPower|Phrase" | head -40 | while IFS= read -r l; do echo "::warning::$l"; done
          echo "total TS errors: $(grep -c 'error TS' tsc.log)"
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon
      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/OffGrid-Atlas-${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: OffGrid-Atlas-apk
          path: out/*.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create atlas-${{ github.run_number }} out/*.apk \
            --target ${{ github.sha }} --title "Off Grid Atlas build ${{ github.run_number }}" \
            --notes "Install this APK on your Android phone. Adds read-aloud, voice mode and hands-free mode."
