name: Build Atlas APK

# Builds an installable Android APK (arm64 phones) on every push to atlas-voice,
# and publishes it on the Releases page so it can be downloaded on the phone.
on:
  push:
    branches: [atlas-voice]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc || true
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-
      - name: Install JS dependencies
        run: npm ci
      - name: Type check (informational)
        run: npx tsc --noEmit -p . || true
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon
      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/OffGrid-Atlas-${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: OffGrid-Atlas-apk
          path: out/*.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create atlas-${{ github.run_number }} out/*.apk \
            --target ${{ github.sha }} --title "Off Grid Atlas build ${{ github.run_number }}" \
            --notes "Install this APK on your Android phone. Adds read-aloud, voice mode and hands-free mode."
