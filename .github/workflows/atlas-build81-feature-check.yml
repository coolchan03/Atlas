name: Atlas Build 81 Feature Checks

on:
  push:
    branches: [atlas/build81-health-connect]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typescript-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: TypeScript typecheck
        run: ./node_modules/.bin/tsc --noEmit -p .
      - name: Focused build-81 regression tests
        run: |
          ./node_modules/.bin/jest --runInBand --coverage=false --silent \
            __tests__/unit/atlasTools/englishWordOfDay.test.ts \
            __tests__/unit/services/tools/atlasContactDrafts.test.ts \
            __tests__/unit/services/tools/atlasCodeProjects.test.ts \
            __tests__/unit/services/tools/atlasScheduledDrafts.test.ts \
            __tests__/unit/services/atlasPresentationLayouts.test.ts \
            __tests__/unit/services/tools/atlasLocalSkills.test.ts \
            __tests__/unit/services/tools/atlasMovieWatches.test.ts
