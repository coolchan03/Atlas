name: Build Atlas voices

# Repackages free natural-voice models (Kokoro, Piper; from the sherpa-onnx project) as plain
# .zip files on the "atlas-voices" release, so the app can download and unpack them easily.
on:
  workflow_dispatch:
  push:
    branches: [atlas-voice]
    paths: ['.github/workflows/atlas-voices.yml']

permissions:
  contents: write

jobs:
  voices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Repackage voices
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh release view atlas-voices >/dev/null 2>&1 || gh release create atlas-voices --target "$GITHUB_SHA" \
            --title "Atlas voices" --notes "Natural offline voices for the Atlas app (Settings > Models > Voice). Kokoro (Apache-2.0) and Piper voices, packaged from the sherpa-onnx project."
          mkdir -p work && cd work
          for pair in kokoro-en:kokoro-int8-en-v0_19 piper-amy:vits-piper-en_US-amy-medium piper-ryan:vits-piper-en_US-ryan-medium \
                      piper-lessac:vits-piper-en_US-lessac-medium piper-joe:vits-piper-en_US-joe-medium piper-hfc:vits-piper-en_US-hfc_female-medium; do
            id=${pair%%:*}; src=${pair#*:}
            curl -sSL --retry 3 -o "$src.tar.bz2" "https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/$src.tar.bz2"
            tar -xjf "$src.tar.bz2" && rm "$src.tar.bz2"
            (cd "$src" && zip -q -r -1 "../$id.zip" .)
            rm -rf "$src"
            echo "::notice title=Voice $id::$(du -h $id.zip | cut -f1)"
            gh release upload atlas-voices "$id.zip" --clobber
            rm "$id.zip"
          done
