name: Build Atlas web (PWA)

# Builds the installable web app (react-native-web + Vite) from the same source as the Android app, checks it in a real
# browser (boots, installs a service worker, opens with the network off), and publishes it as a GitHub Pages site
# (https://<owner>.github.io/<repo>/) by pushing the built files to the gh-pages branch. One-time setup: Settings > Pages >
# Build and deployment > Source "Deploy from a branch" > branch gh-pages, folder / (root). Every run also keeps the built
# site as a workflow file (atlas-web) to host anywhere.
on:
  push:
    branches: [main, claude/wizardly-brown-yik8o4]
    paths:
      - 'web/**'
      - 'src/**'
      - 'App.tsx'
      - 'assets/**'
      - 'android/app/src/main/assets/models/**'
      - '.github/workflows/atlas-web.yml'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Publish to the gh-pages branch even when run from a branch other than main'
        type: boolean
        default: false

concurrency:
  group: atlas-web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      # The web build compiles the app's own source, which imports the React Native JavaScript packages from the root.
      - name: Install app packages (JavaScript only, no native builds)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install web packages
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: web
      - name: Type-check the web layer
        run: npm run typecheck
        working-directory: web
      - name: Build (relative paths, so it works under any URL such as /Atlas/)
        run: npm run build
        working-directory: web
        env:
          ATLAS_BASE: ./
      - name: Install a browser for the checks
        run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Check the PWA in a browser (boots, service worker, offline, isolation)
        working-directory: web
        run: |
          npx vite preview --port 4173 &
          sleep 4
          node scripts/pwa-check.mjs http://localhost:4173/
          node scripts/smoke.mjs http://localhost:4173/ smoke.png
          node scripts/server-backend-test.mjs http://localhost:4173/
          node scripts/llm-e2e.mjs http://localhost:4173/
          node scripts/voice-e2e.mjs http://localhost:4173/
          node scripts/zim-test.mjs http://localhost:4173/
          curl -fsSL -o /tmp/monaco.map https://download.mapsforge.org/maps/v5/europe/monaco.map
          node scripts/map-test.mjs http://localhost:4173/ /tmp/monaco.map
          node scripts/video-test.mjs http://localhost:4173/
      - name: WebGPU engine (software GPU; informational, does not block)
        continue-on-error: true
        working-directory: web
        run: |
          npx vite preview --port 4174 --strictPort &
          sleep 3
          timeout 900 node scripts/webgpu-e2e.mjs http://localhost:4174/
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-web
          path: web/dist
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-web-smoke
          path: web/smoke.png
          if-no-files-found: ignore
          retention-days: 7

  # The site is pushed to the gh-pages branch (one commit, replaced every time, so the branch never grows). Pushes made with the
  # workflow's own token do not start other workflows.
  publish:
    needs: build
    if: github.event_name == 'push' || inputs.deploy == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: atlas-web
          path: site
      - name: Add the files GitHub Pages wants
        run: |
          touch site/.nojekyll
          cp site/index.html site/404.html   # a deep link or a refresh still opens the app
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site
          publish_branch: gh-pages
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Atlas web build ${{ github.run_number }} (${{ github.sha }})'
      - name: Turn on GitHub Pages for the gh-pages branch (needs repository admin rights; skipped when the token lacks them)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/pages" -f "source[branch]=gh-pages" -f "source[path]=/" || echo "::notice title=Pages::Set Settings > Pages > Source to 'Deploy from a branch', gh-pages, / (root) once."
