name: Build Atlas for Windows

# Builds the Windows app (Electron around the web build, with llama.cpp's llama-server bundled for full-speed CPU / Vulkan /
# optional CUDA inference): an installer (Atlas-<version>-Setup.exe), a no-install portable exe, and a plain zip.
# A test build keeps them as workflow files. Tick "publish" to attach them to a GitHub release (and feed in-app updates).
on:
  push:
    branches: [main, claude/wizardly-brown-yik8o4]
    paths:
      - 'desktop/**'
      - 'web/**'
      - 'src/**'
      - 'App.tsx'
      - '.github/workflows/atlas-windows.yml'
  workflow_dispatch:
    inputs:
      llama_tag:
        description: 'llama.cpp release tag to bundle (blank = latest)'
        type: string
        default: ''
      cuda:
        description: 'Also bundle the NVIDIA CUDA build (adds about 400 MB; Vulkan already covers NVIDIA, AMD and Intel GPUs)'
        type: boolean
        default: false
      publish:
        description: 'Attach the installer, portable exe and zip to a GitHub release'
        type: boolean
        default: false

concurrency:
  group: atlas-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast check on Linux: the Electron shell starts, the bridge and disk file system work, a model downloads and answers
  # through the WASM engine, and the llama-server manager drives a stand-in engine (desktop/test/fake-llama).
  shell-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
            desktop/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm ci --ignore-scripts --no-audit --no-fund && ATLAS_TARGET=desktop npx vite build
        working-directory: web
      - run: npm ci --no-audit --no-fund
        working-directory: desktop
      - name: Shell self-test with a real small model (WASM engine)
        working-directory: desktop
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgtk-3-0 libnss3 libasound2t64 || true
          ATLAS_SELFTEST=1 ATLAS_SELFTEST_LLM=1 ATLAS_NO_SANDBOX=1 xvfb-run -a ./node_modules/.bin/electron . --no-sandbox --disable-gpu | tee selftest.log
          grep -q "SELFTEST PASSED" selftest.log
      - name: Shell self-test with the stand-in llama-server
        working-directory: desktop
        run: |
          ATLAS_LLAMA_DIR=$PWD/test/fake-llama ATLAS_SELFTEST=1 ATLAS_SELFTEST_LLM=1 ATLAS_NO_SANDBOX=1 xvfb-run -a ./node_modules/.bin/electron . --no-sandbox --disable-gpu | tee selftest2.log
          grep -q "SELFTEST PASSED" selftest2.log
          grep -q '"engine":"llama-server"' selftest2.log

  windows:
    needs: shell-test
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
            desktop/package-lock.json
      - name: Install app packages (JavaScript only)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install and build the web app for the desktop shell
        shell: bash
        run: |
          cd web
          npm ci --no-audit --no-fund
          ATLAS_TARGET=desktop npx vite build
      - name: Install desktop packages
        run: npm ci --no-audit --no-fund
        working-directory: desktop
      # If no recent llama.cpp release has Windows builds, the app is still built: it then runs models with its in-app WebAssembly
      # engine, and the log says so.
      - name: Download llama.cpp (llama-server.exe)
        continue-on-error: true
        working-directory: desktop
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLAMA_TAG: ${{ inputs.llama_tag }}
          LLAMA_VARIANTS: ${{ inputs.cuda == true && 'cpu,vulkan,cuda' || 'cpu,vulkan' }}
        run: |
          [ -n "$LLAMA_TAG" ] || unset LLAMA_TAG
          mkdir -p resources/llama
          node scripts/fetch-llama.mjs || echo "::warning title=No llama.cpp engine bundled::The app will use its built-in WebAssembly engine."
          mkdir -p resources/llama
      - name: Start-up check of the packaged shell (unpacked app, runs the page test)
        working-directory: desktop
        shell: bash
        run: |
          npx electron-builder --win --dir --publish never
          ATLAS_SELFTEST=1 ATLAS_SELFTEST_SHOT=selftest.png ./dist/win-unpacked/Atlas.exe || true
      - name: Build the installer, portable exe and zip
        working-directory: desktop
        shell: bash
        run: |
          npx electron-builder --win nsis portable zip --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: List the outputs
        shell: bash
        run: ls -la desktop/dist
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-windows
          path: |
            desktop/dist/*.exe
            desktop/dist/*.zip
            desktop/dist/latest.yml
            desktop/dist/*.blockmap
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-windows-selftest
          path: desktop/selftest.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Attach to a release
        if: inputs.publish == true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./desktop/package.json').version")
          TAG="atlas-windows-${VERSION}-${{ github.run_number }}"
          gh release create "$TAG" --target "${{ github.sha }}" --title "Atlas for Windows ${VERSION} (build ${{ github.run_number }})" --notes "Windows installer, portable exe and zip. Install the Setup exe, or run the Portable exe with no install. The AI engine (llama.cpp) is bundled; download a model inside the app." desktop/dist/*.exe desktop/dist/*.zip desktop/dist/latest.yml desktop/dist/*.blockmap
