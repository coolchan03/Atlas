// Atlas-owned wrapper: build pinned llama.kt sources without altering its git submodule.
apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'

def llamaKtSource = file("${rootProject.projectDir}/../vendor/llama-kt/llama-kt/src/main")

android {
    namespace 'com.tensai.llamakt'
    compileSdk rootProject.ext.compileSdkVersion
    ndkVersion rootProject.ext.ndkVersion
    defaultConfig {
        minSdkVersion 29
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake { arguments '-DANDROID_STL=c++_shared' }
        }
    }
    sourceSets {
        main {
            java.srcDirs = [file("${llamaKtSource}/java")]
            jniLibs.srcDirs = [file("${llamaKtSource}/jniLibs")]
        }
    }
    externalNativeBuild {
        cmake {
            path file("${rootProject.projectDir}/../vendor/llama-kt/llama-kt/src/main/cpp/CMakeLists.txt")
        }
    }
}

kotlin {
    jvmToolchain(17)
    sourceSets.main.kotlin.srcDirs(file("${llamaKtSource}/java"))
}

dependencies {
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.9.0'
}
